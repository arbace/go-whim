[package]
name = "whimsy"
version = "0.1.0"
edition = "2021"
description = "whim's editor core in Rust, translated from C by crefactor/togo's Rust backend (doc/RUST.md)"
license = "Vim"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "whimsy"
path = "src/main.rs"

[dependencies]

[profile.release]
opt-level = 2
debug = false
# The core's signed arithmetic is Rust's plain + - *, where C leaves an
# overflow undefined and gcc's -O0 wraps (doc/RUST-IDIOMS.md, item 4): the
# release build wraps as gcc's does, whatever the defaults; a build with
# overflow checks (CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS=true) panics there.
overflow-checks = false
